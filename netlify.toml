[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# BOZZA: rimuovere questo blocco alla messa online definitiva, insieme al meta robots in index.html
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Le pagine esistenti hanno un loro index.html (meta pre-renderizzati); il resto passa all'app,
# che mostra la pagina 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
